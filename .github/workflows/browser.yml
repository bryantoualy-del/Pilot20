name: Character creator browser tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      PILOT20_E2E_BROWSER: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npm run build:web
      - name: Verify dark theme and disclosure controls
        run: npm run test:e2e:appearance
      - uses: actions/upload-artifact@v4
        with:
          name: appearance-preview-${{ matrix.engine }}
          path: docs/screenshots/appearance/
      - name: Verify race picker and Custom lineage
        run: npm run test:e2e:race-picker
      - name: Verify unified sources and reversible MJ restrictions
        run: node e2e/unified-sources.mjs
      - run: node e2e/compact-creator.mjs
      - name: Verify approved iPad/phone six-stage journey
        run: node e2e/validated-journey.mjs
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: pilot20-work4-local-build-${{ matrix.engine }}
          path: dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creator-browser-evidence-${{ matrix.engine }}
          path: |
            artifacts/e2e-work4-final-results.json
            artifacts/e2e-work4-grimoire-results.json
            artifacts/e2e-work4-creator-results.json
            artifacts/e2e-results.json
            artifacts/e2e-v031-results.json
            artifacts/e2e-v032-results.json
            artifacts/e2e-races-quick-results.json
            docs/screenshots/
