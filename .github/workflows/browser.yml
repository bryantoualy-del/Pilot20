name: Character creator browser tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build:web
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creator-browser-evidence
          path: |
            artifacts/e2e-work4-creator-results.json
            artifacts/e2e-results.json
            artifacts/e2e-v031-results.json
            artifacts/e2e-v032-results.json
            artifacts/e2e-races-quick-results.json
            docs/screenshots/
