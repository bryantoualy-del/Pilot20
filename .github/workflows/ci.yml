name: Core tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run demo

      - run: npm run demo:characters

      - run: npm run demo:combat
      # npm test asserts the five-round reactive transcript; no redundant second replay.
      - run: npm run coverage:check

      - run: npm run demo:catalog
      - run: npm run coverage:catalog:check

      - run: npm run demo:progression
